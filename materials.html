<script>
'use strict';
const total=53, slide=document.getElementById('slide'), input=document.getElementById('page'), prev=document.getElementById('prev'), next=document.getElementById('next'), counter=document.getElementById('counter'), error=document.getElementById('error');
const path=n=>`page-${String(n).padStart(2,'0')}.jpg`;
let current=0;
function show(n){n=Math.max(1,Math.min(total,Math.trunc(Number(n)||1)));current=n;error.hidden=true;slide.src=path(n);slide.alt=`심층자료 ${n}페이지 / 총 ${total}페이지`;input.value=n;counter.textContent=`${n} / ${total}`;prev.disabled=n===1;next.disabled=n===total;history.replaceState(null,'',`#page=${n}`);for(const p of [n-1,n+1])if(p>=1&&p<=total){const img=new Image();img.src=path(p)}}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));input.addEventListener('change',()=>show(input.value));input.addEventListener('keydown',e=>{if(e.key==='Enter'){show(input.value);input.blur()}});
document.addEventListener('keydown',e=>{if(e.target.closest?.('.video-library')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='Home'){e.preventDefault();show(1)}if(e.key==='End'){e.preventDefault();show(total)}});
let touch=null;slide.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});slide.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(window.visualViewport&&window.visualViewport.scale>1.05)return;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1))},{passive:true});slide.addEventListener('error',()=>error.hidden=false);window.addEventListener('hashchange',()=>show(new URLSearchParams(location.hash.slice(1)).get('page')));show(new URLSearchParams(location.hash.slice(1)).get('page'));
</script><script>
(() => {
  const player = document.getElementById('materials-video');
  const download = document.getElementById('video-download');
  const buttons = Array.from(document.querySelectorAll('.video-library [data-video]'));
  buttons.forEach(button => button.addEventListener('click', () => {
    buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    player.hidden = false;
    player.setAttribute('aria-label', button.getAttribute('aria-label'));
    player.src = 'media/materials/' + button.dataset.video + '.mp4';
    download.href = player.src;
    download.download = button.getAttribute('aria-label').replace(': ', ' ') + '.mp4';
    download.hidden = false;
    player.play().catch(() => {});
  }));
})();
